section{padding-block:clamp(5rem,11vw,10rem);position:relative}
.lgo{color:var(--lg)}.lgo svg{display:block;width:100%;height:auto;overflow:visible}
/* background aurora + cursor glow + progress */
.bl{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--bo);z-index:-1;animation:bl 20s ease-in-out infinite alternate}
.b1{width:34rem;height:34rem;background:#1d4a6a;top:-8rem;inset-inline-start:-8rem}

.cg{position:fixed;top:0;left:0;width:26rem;height:26rem;margin:-13rem 0 0 -13rem;border-radius:50%;background:radial-gradient(circle,rgba(92,214,255,.16),transparent 65%);pointer-events:none;z-index:0;transition:transform .15s ease-out}

.pg{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--sky),var(--neon));transform-origin:0 50%;transform:scaleX(var(--p,0))}
/* glass */
.g{position:relative;overflow:hidden;background:var(--gl);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);border-radius:var(--r);box-shadow:0 10px 40px var(--sh),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05)}

.stats{display:flex;flex-wrap:wrap;gap:2.5rem;margin-top:3.5rem}
.stats b{display:block;font-size:2rem;font-weight:800;line-height:1.1;color:var(--ac)}.stats span{font-size:.9rem;color:var(--mut)}
.orb{position:relative;width:100%;max-width:26rem;aspect-ratio:1;margin-inline:auto;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,var(--neon),transparent 40%,var(--sky),transparent);animation:sp 8s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.core{width:80%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.core .lgo{width:60%;filter:drop-shadow(0 0 12px rgba(92,214,255,.6));animation:glw 3s ease-in-out infinite alternate}
.fc{position:absolute;padding:.5rem 1.1rem;border-radius:99px;font-weight:700;font-size:.85rem;animation:fl 5s ease-in-out infinite alternate}
/* marquee */
.mq{overflow:hidden;direction:ltr;padding-block:1rem;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:flex;width:max-content;animation:mq 32s linear infinite;font-weight:800;font-size:clamp(1.6rem,4vw,2.8rem);color:transparent;-webkit-text-stroke:1px var(--ac)}
.mq span{padding-inline-end:3rem}.mq span::after{content:"✦";margin-inline-start:3rem;color:var(--neon);-webkit-text-stroke:0}

.sh h2,.ab h2{font-size:clamp(1.9rem,4vw,2.5rem)}

.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1.75rem}

.wc{display:block;padding:.9rem}.wc h3{margin:1rem .4rem .1rem;font-size:1.15rem}.wc p{margin:0 .4rem .5rem;font-size:.92rem}

.fm{max-width:42rem;margin:3rem auto 0;padding:clamp(1.5rem,4vw,2.5rem);display:grid;gap:1.1rem}

@keyframes bl{to{transform:translate(8vw,6vh) scale(1.25)}}

@keyframes up{from{opacity:0;transform:translateY(36px) scale(.96)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
